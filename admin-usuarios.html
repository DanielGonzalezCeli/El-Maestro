<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Usuarios — El Maestro Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sora:wght@700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
  :root {
    --azul:#1B3F6E; --azul-medio:#2A5FA5; --azul-claro:#EAF1FB;
    --naranja:#F47B20; --blanco:#FFFFFF; --fondo:#F5F7FA; --texto:#111827;
    --suave:#4B5563; --tenue:#9CA3AF; --borde:#E5E9F0;
    --error:#DC2626; --error-bg:#FEF2F2; --exito:#16A34A; --exito-bg:#F0FDF4;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Plus Jakarta Sans',sans-serif; background:var(--fondo); color:var(--texto); }
  :focus-visible { outline:3px solid var(--naranja); outline-offset:3px; border-radius:4px; }

  nav { background:var(--azul); padding:0 48px; height:64px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100; }
  .logo { font-family:'Sora',sans-serif; font-size:20px; color:var(--blanco); text-decoration:none; }
  .logo span { color:var(--naranja); }
  .nav-badge { background:var(--naranja); color:var(--blanco); font-size:10px; font-weight:700; padding:3px 9px; border-radius:20px; margin-left:10px; vertical-align:middle; }
  .nav-links { list-style:none; display:flex; gap:6px; font-size:14px; }
  .nav-links a { text-decoration:none; color:var(--blanco); font-weight:600; padding:8px 16px; border-radius:8px; display:block; }
  .nav-links a:hover { background:rgba(255,255,255,0.15); }
  .nav-links a.activo { background:var(--naranja); }
  .nav-acc { display:flex; gap:10px; align-items:center; }
  .nav-usuario { color:var(--blanco); font-size:13px; font-weight:600; }
  .btn-ghost { padding:8px 18px; border:1.5px solid rgba(255,255,255,0.5); border-radius:8px; background:transparent; font-size:13px; font-family:'Plus Jakarta Sans',sans-serif; color:var(--blanco); font-weight:600; cursor:pointer; }
  .btn-ghost:hover { background:rgba(255,255,255,0.1); }

  .hero-admin { background:var(--azul); padding:32px 48px 28px; border-bottom:1px solid rgba(255,255,255,0.1); }
  .hero-admin h1 { font-family:'Sora',sans-serif; font-size:24px; color:var(--blanco); }
  .hero-admin p { font-size:13px; color:#93B8E0; margin-top:6px; }

  .contenido { padding:32px 48px 60px; max-width:1100px; margin:0 auto; }
  .panel-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
  .panel-titulo { font-family:'Sora',sans-serif; font-size:18px; color:var(--azul); }

  .tabla-wrap { background:var(--blanco); border:1px solid var(--borde); border-radius:14px; overflow:hidden; }
  table { width:100%; border-collapse:collapse; }
  thead { background:var(--fondo); }
  th { padding:12px 16px; text-align:left; font-size:11px; font-weight:700; color:var(--suave); text-transform:uppercase; letter-spacing:0.05em; border-bottom:1px solid var(--borde); }
  td { padding:14px 16px; font-size:13px; color:var(--texto); border-bottom:1px solid var(--borde); vertical-align:middle; }
  tr:last-child td { border-bottom:none; }
  tr:hover td { background:var(--fondo); }
  .td-acciones { display:flex; gap:6px; align-items:center; }
  .btn-icono { width:32px; height:32px; border-radius:7px; border:1.5px solid var(--borde); background:var(--blanco); cursor:pointer; display:inline-flex; align-items:center; justify-content:center; font-size:13px; color:var(--suave); transition:all 0.15s; }
  .btn-icono:hover { border-color:var(--azul-medio); color:var(--azul); }
  .btn-icono.eliminar:hover { border-color:var(--error); color:var(--error); background:var(--error-bg); }
  .badge-rol { display:inline-block; font-size:10px; font-weight:700; padding:3px 10px; border-radius:12px; }
  .badge-admin { background:#FEF3C7; color:#92400E; }
  .badge-usuario { background:var(--azul-claro); color:var(--azul-medio); }
  .btn-rol { font-size:11px; font-weight:700; padding:4px 10px; border-radius:8px; border:1.5px solid var(--borde); background:var(--blanco); cursor:pointer; color:var(--suave); transition:all 0.15s; white-space:nowrap; }
  .btn-rol:hover { border-color:var(--naranja); color:var(--naranja); }
  .estado-tabla { padding:32px; text-align:center; color:var(--tenue); font-size:13px; }
  .notif { position:fixed; top:80px; right:24px; background:var(--exito); color:var(--blanco); padding:12px 20px; border-radius:10px; font-size:13px; font-weight:600; z-index:999; opacity:0; transition:opacity 0.3s; pointer-events:none; }
  .notif.visible { opacity:1; }

  /* MODAL CONFIRMAR */
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:200; display:none; align-items:center; justify-content:center; padding:20px; }
  .modal-overlay.abierto { display:flex; }
  .modal { background:var(--blanco); border-radius:18px; padding:32px; width:100%; max-width:400px; position:relative; }
  .modal-titulo { font-family:'Sora',sans-serif; font-size:18px; color:var(--azul); margin-bottom:16px; }
  .modal-cerrar { position:absolute; top:16px; right:16px; background:none; border:none; font-size:18px; cursor:pointer; color:var(--tenue); }
  .modal-acciones { display:flex; gap:10px; justify-content:flex-end; margin-top:24px; }
  .btn-secundario { padding:10px 22px; background:var(--blanco); border:1.5px solid var(--borde); border-radius:8px; font-size:13px; font-weight:600; font-family:'Plus Jakarta Sans',sans-serif; color:var(--suave); cursor:pointer; }
  .btn-eliminar-confirmar { padding:10px 22px; background:var(--error); border:none; border-radius:8px; color:var(--blanco); font-size:13px; font-weight:700; font-family:'Plus Jakarta Sans',sans-serif; cursor:pointer; }

  @media(max-width:900px) { nav { padding:0 16px; } .contenido { padding:20px 16px 40px; } .hero-admin { padding:20px 16px; } }
</style>
</head>
<body>

<div class="notif" id="notif-global"></div>

<nav aria-label="Panel de administración">
  <a href="admin.html" class="logo">El <span>Maestro</span><span class="nav-badge">ADMIN</span></a>
  <ul class="nav-links" role="list">
    <li><a href="admin.html">Dashboard</a></li>
    <li><a href="admin-profesionales.html">Profesionales</a></li>
    <li><a href="admin-mensajes.html">Mensajes</a></li>
    <li><a href="admin-usuarios.html" class="activo" aria-current="page">Usuarios</a></li>
  </ul>
  <div class="nav-acc">
    <span class="nav-usuario" id="nav-nombre-admin">—</span>
    <button class="btn-ghost" onclick="cerrarSesion()">Salir</button>
  </div>
</nav>

<div class="hero-admin">
  <h1>Usuarios Registrados</h1>
  <p>Gestiona cuentas y roles de la plataforma</p>
</div>

<div class="contenido">
  <div class="panel-header">
    <span class="panel-titulo">Usuarios (<span id="count-users">—</span>)</span>
  </div>
  <div class="tabla-wrap">
    <table>
      <thead><tr><th>Nombre</th><th>Apellido</th><th>Correo</th><th>Rol</th><th>Registro</th><th>Acciones</th></tr></thead>
      <tbody id="tabla-users"><tr><td colspan="6" class="estado-tabla">Cargando…</td></tr></tbody>
    </table>
  </div>
</div>

<!-- MODAL CONFIRMAR ELIMINACIÓN -->
<div class="modal-overlay" id="modal-confirm" onclick="cerrarModalFuera(event,'modal-confirm')" role="presentation">
  <div class="modal" role="dialog" aria-modal="true">
    <button class="modal-cerrar" onclick="cerrarModal('modal-confirm')" aria-label="Cerrar">✕</button>
    <div class="modal-titulo"><i class="fa-solid fa-triangle-exclamation" style="color:var(--error);"></i> Confirmar eliminación</div>
    <p style="font-size:14px;color:var(--suave);margin-bottom:8px;" id="confirm-msg">¿Eliminar este usuario? Esta acción no se puede deshacer.</p>
    <div class="modal-acciones">
      <button class="btn-secundario" onclick="cerrarModal('modal-confirm')">Cancelar</button>
      <button class="btn-eliminar-confirmar" id="btn-confirmar-eliminar">Sí, eliminar</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script>
  let adminId = null;

  async function init() {
    const { data: { session } } = await db.auth.getSession();
    if (!session) { window.location.href = 'index.html'; return; }
    adminId = session.user.id;
    const { data: usuario } = await db.from('usuarios').select('rol,nombre,apellido').eq('id', adminId).single();
    if (!usuario || usuario.rol !== 'admin') { alert('Acceso denegado.'); window.location.href = 'index.html'; return; }
    document.getElementById('nav-nombre-admin').textContent = `${usuario.nombre} ${usuario.apellido}`;
    await cargarUsers();
  }

  async function cerrarSesion() { await db.auth.signOut(); window.location.href = 'index.html'; }

  async function cargarUsers() {
    const { data, error } = await db.from('usuarios').select('*').order('created_at', { ascending:false });
    const tb = document.getElementById('tabla-users');
    if (error || !data) { tb.innerHTML = `<tr><td colspan="6" class="estado-tabla">Error al cargar.</td></tr>`; return; }
    document.getElementById('count-users').textContent = data.length;
    if (data.length === 0) { tb.innerHTML = `<tr><td colspan="6" class="estado-tabla">Sin usuarios registrados.</td></tr>`; return; }
    tb.innerHTML = data.map(u => {
      const esSelf = u.id === adminId;
      const nuevoRol = u.rol === 'admin' ? 'usuario' : 'admin';
      const btnRolLabel = u.rol === 'admin' ? '→ usuario' : '→ admin';
      return `<tr>
        <td><strong>${u.nombre || '—'}</strong></td>
        <td>${u.apellido || '—'}</td>
        <td style="color:var(--suave);">${u.correo || '—'}</td>
        <td><span class="badge-rol ${u.rol === 'admin' ? 'badge-admin' : 'badge-usuario'}">${u.rol}</span></td>
        <td style="color:var(--tenue);white-space:nowrap;">${u.created_at ? new Date(u.created_at).toLocaleDateString('es-EC',{day:'2-digit',month:'short',year:'numeric'}) : '—'}</td>
        <td><div class="td-acciones">
          ${!esSelf ? `<button class="btn-rol" onclick="cambiarRol('${u.id}','${nuevoRol}','${(u.nombre||'').replace(/'/g,"\\'")}')"><i class="fa-solid fa-user-gear"></i> ${btnRolLabel}</button>` : '<span style="font-size:12px;color:var(--tenue);">Tú</span>'}
          ${!esSelf ? `<button class="btn-icono eliminar" onclick="confirmarEliminar('${u.id}','${(u.nombre||'').replace(/'/g,"\\'")}')"><i class="fa-solid fa-trash"></i></button>` : ''}
        </div></td>
      </tr>`;
    }).join('');
  }

  async function cambiarRol(id, nuevoRol, nombre) {
    const { error } = await db.from('usuarios').update({ rol: nuevoRol }).eq('id', id);
    if (!error) { mostrarNotif(`Rol de ${nombre} cambiado a "${nuevoRol}".`); cargarUsers(); }
  }

  function confirmarEliminar(id, nombre) {
    document.getElementById('confirm-msg').textContent = `¿Eliminar al usuario ${nombre}? Esta acción no se puede deshacer.`;
    const btn = document.getElementById('btn-confirmar-eliminar');
    btn.onclick = async () => {
      btn.disabled = true; btn.textContent = 'Eliminando…';
      await db.from('usuarios').delete().eq('id', id);
      btn.disabled = false; btn.textContent = 'Sí, eliminar';
      cerrarModal('modal-confirm');
      cargarUsers();
    };
    abrirModal('modal-confirm');
  }

  function mostrarNotif(msg) {
    const el = document.getElementById('notif-global');
    el.textContent = msg; el.classList.add('visible');
    setTimeout(() => el.classList.remove('visible'), 3000);
  }

  function abrirModal(id) { document.getElementById(id).classList.add('abierto'); document.body.style.overflow='hidden'; }
  function cerrarModal(id) { document.getElementById(id).classList.remove('abierto'); document.body.style.overflow=''; }
  function cerrarModalFuera(e, id) { if (e.target === document.getElementById(id)) cerrarModal(id); }
  document.addEventListener('keydown', e => { if (e.key==='Escape' && document.getElementById('modal-confirm').classList.contains('abierto')) cerrarModal('modal-confirm'); });

  init();
</script>
</body>
</html>
